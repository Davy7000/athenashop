    color: aqua;

<body>
    <div id="message"></div> <br />
        <span id="profil"> Prenom  </span>
        
        <span id="profil1"> NOM </span>
    <h1>Nous sommes le <br/>
    <span><span class="jour">jour</span></span> <span class="numero">XX</span> <span class="mois">mois</span> <span class="annee">XXXX</span></span></h1>
    <h1>Il est <br />
    <span class="heure">00</span>
    <span>:</span>
    <span class="minutes">00</span>
    <span>:</span>
    <span class="secondes">00</span>
    <span>:</span>
    <span class="mill">00</span>
    </h1>
    

    <script>
        const messageElement = document.getElementById('message');
        
        const annee = new Date().getFullYear();
        const jourj = new Date().getDate();
        const jour = new Date().getDay();
        const mois = new Date().getMonth();
        
        /*
        =========================
        construction des tableaux 
        ==========================
        */
        
        const moisAray = ['Janvier','Fevrier','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Decembre'];
        
        const jourAray = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
        /*
        ======================
        fin de la construction 
        ======================
        */

        function miseAJourMessage() {
            const heureActuelle = new Date().getHours();
            const minutes = new Date().getMinutes();
            const secondes = new Date().getSeconds();
            
            
            let res = `Il est ${heureActuelle}h${minutes}m${secondes}s`;
            if (heureActuelle < 12) {
                messageElement.textContent = 'Bonjour !';
            } else if (heureActuelle < 18) {
                messageElement.textContent = 'Bon après-midi !';
            } else {
                messageElement.textContent = 'Bonsoir !';
            }
            
            
        document.querySelector('.heure').textContent = heureActuelle;
        document.querySelector('.minutes').textContent = minutes;
        document.querySelector('.secondes').textContent = secondes;
        }

        // Mise à jour initiale
        miseAJourMessage();

        // Mise à jour toutes les secondes
        setInterval(miseAJourMessage, 1000);

        
        document.querySelector('.annee').textContent = annee;
        document.querySelector('.mois').textContent = moisAray[mois];
        document.querySelector('.numero').textContent = jourj;
        document.querySelector('.jour').textContent = jourAray[jour - 1];
        
        function millS(){
              const mill = new Date().getMilliseconds();
              document.querySelector('.mill').textContent = mill;
        }
        millS();
        
        setInterval(millS,100);
    
      setTimeout(() => {
          window.open('./compte.html', '_self');
        }, 5000);
        
//recuperation du nom et prenom du client

const nom = localStorage.getItem('nom');

    </script>
</body>
